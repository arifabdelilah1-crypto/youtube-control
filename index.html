<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <title>Short Viral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32"><rect x="2.5" y="6.5" width="27" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M13 11.5l7 4.5-7 4.5z" fill="currentColor"/><circle cx="26" cy="6.5" r="4" fill="#E5322C" stroke="#FBFCFD" stroke-width="2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-research" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 17l6-6 4 4 7-7.5"/><path d="M15 7.5h5.5V13"/></symbol>
    <symbol id="i-ideas" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.7 10.7c.6.5 1.1 1.2 1.1 2V16h5.2v-.3c0-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-studio" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9l1.6-4.7 15.6 2.1L21 9"/><path d="M8.6 4.9l2.6 3.9M14.2 5.6l2.6 3.4"/></symbol>
    <symbol id="i-channels" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.5 15.5a5 5 0 0 1 0-7M15.5 8.5a5 5 0 0 1 0 7M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M6 3.5v17M12 3.5v17M18 3.5v17"/><rect x="3.8" y="13" width="4.4" height="3.4" rx="1" fill="var(--panel)"/><rect x="9.8" y="6.5" width="4.4" height="3.4" rx="1" fill="var(--panel)"/><rect x="15.8" y="10.5" width="4.4" height="3.4" rx="1" fill="var(--panel)"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></symbol>
    <symbol id="i-all" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.6"/><circle cx="6" cy="17" r="2.6"/><path d="M8.2 8.6L20 18M8.2 15.4L20 6"/></symbol>
    <symbol id="i-sched" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M10 13.2l4 2.3-4 2.3z"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 12.2l2.2 2.2L15.2 10"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-results" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-4M12 16V6M17 16v-7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
    <symbol id="i-cost" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.2c-.5-.9-1.5-1.4-2.6-1.4-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2c1.5.3 2.6.9 2.6 2.1s-1.1 2-2.6 2c-1.2 0-2.2-.5-2.7-1.5M12 6v1.8M12 16.2V18"/></symbol>
    <symbol id="i-anim" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10.2 9.3v5.4l4.6-2.7z"/><path d="M3 8h2M3 16h2M19 8h2M19 16h2"/></symbol>
  </svg>

  <div id="app" class="shell" hidden>
    <nav class="side" aria-label="Main">
      <a class="brand" href="#/home"><svg aria-hidden="true"><use href="#logo"/></svg><span>Short Viral</span></a>
      <div class="side-links">
        <a href="#/home" data-route="home"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#/research" data-route="research"><svg class="i" aria-hidden="true"><use href="#i-research"/></svg><span>Research</span></a>
        <a href="#/trending" data-route="trending"><svg class="i" aria-hidden="true"><use href="#i-trend"/></svg><span>Trending</span></a>
        <a href="#/ideas" data-route="ideas"><svg class="i" aria-hidden="true"><use href="#i-ideas"/></svg><span>Ideas</span></a>
        <a href="#/animation" data-route="animation"><svg class="i" aria-hidden="true"><use href="#i-anim"/></svg><span>Animation</span></a>
        <a href="#/review" data-route="review"><svg class="i" aria-hidden="true"><use href="#i-review"/></svg><span>Review</span></a>
        <a href="#/music" data-route="music"><svg class="i" aria-hidden="true"><use href="#i-music"/></svg><span>Music</span></a>
        <a href="#/clipper" data-route="clipper"><svg class="i" aria-hidden="true"><use href="#i-clip"/></svg><span>Clipper</span></a>
        <a href="#/studio" data-route="studio"><svg class="i" aria-hidden="true"><use href="#i-studio"/></svg><span>Studio</span></a>
        <a href="#/schedule" data-route="schedule"><svg class="i" aria-hidden="true"><use href="#i-sched"/></svg><span>Schedule</span></a>
        <a href="#/automation" data-route="automation"><svg class="i" aria-hidden="true"><use href="#i-auto"/></svg><span>Publish</span></a>
        <a href="#/calendar" data-route="calendar"><svg class="i" aria-hidden="true"><use href="#i-calendar"/></svg><span>Calendar</span></a>
        <a href="#/results" data-route="results"><svg class="i" aria-hidden="true"><use href="#i-results"/></svg><span>Results</span></a>
        <a href="#/costs" data-route="costs"><svg class="i" aria-hidden="true"><use href="#i-cost"/></svg><span>Costs</span></a>
        <a href="#/channels" data-route="channels"><svg class="i" aria-hidden="true"><use href="#i-channels"/></svg><span>Networks</span></a>
        <a href="#/settings" data-route="settings"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></a>
      </div>
      <p class="side-foot">Live counts at every refresh. YouTube Analytics runs about 2 days behind.</p>
    </nav>
    <header class="topbar">
      <a class="brand" href="#/home"><svg aria-hidden="true"><use href="#logo"/></svg><span>Short Viral</span></a>
      <div id="bus" class="bus" role="group" aria-label="Working on"></div>
      <button id="sign-out" class="btn ghost small topbar-out" type="button" aria-label="Sign out"><svg class="i" aria-hidden="true"><use href="#i-out"/></svg><span>Sign out</span></button>
    </header>
    <main id="view" class="main" tabindex="-1"></main>
  </div>

  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand"><svg aria-hidden="true"><use href="#logo"/></svg><span>Short Viral</span></div>
      <h1 id="login-title">Sign in</h1>
      <p id="login-intro" class="muted">Only allow-listed accounts can see data.</p>
      <div id="google-wrap" class="login-google" hidden>
        <button id="login-google" type="button" class="btn">
          <svg aria-hidden="true" viewBox="0 0 18 18" width="18" height="18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="login-or muted small">or</div>
      </div>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" minlength="8" required>
      <div id="confirm-wrap" hidden style="display:flex;flex-direction:column;gap:12px">
        <label for="login-password2">Repeat password</label>
        <input id="login-password2" type="password" autocomplete="new-password" minlength="8">
      </div>
      <button id="login-submit" type="submit" class="btn primary">Sign in</button>
      <button id="login-toggle" type="button" class="btn">First time? Create your password</button>
      <p id="login-msg" class="muted" role="status"></p>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
