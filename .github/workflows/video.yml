name: Render final video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "render_jobs.id"
        required: true
concurrency: { group: "video-${{ github.event.inputs.job_id }}", cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache the headless browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ hashFiles('package-lock.json') }}
      - name: Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: node render/render.mjs "$JOB_ID"
      - name: Keep a backup copy of the video (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.job_id }}
          path: render-output.mp4
          if-no-files-found: ignore
          retention-days: 7
