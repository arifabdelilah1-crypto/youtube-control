name: Prepare voice
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "video_projects.id"
        required: true
      scene_ids:
        description: "Comma-separated scene ids (empty = all scenes)"
        required: false
        default: ""
concurrency: { group: "prepare-${{ github.event.inputs.project_id }}", cancel-in-progress: false }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collectors
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q edge-tts==7.3.1 requests==2.32.3
      - name: Which voice engine
        id: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
        run: python collectors/prepare_job.py --engine "$PROJECT_ID" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg (only for voice styles)
        if: steps.engine.outputs.effects == 'true' && steps.engine.outputs.engine != 'supertonic'
        continue-on-error: true  # the next step reports any failure on the project
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Install Supertonic-3 (only for its voices)
        if: steps.engine.outputs.engine == 'supertonic'
        continue-on-error: true  # the next step reports any failure on the project
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q supertonic==1.3.1 faster-whisper==1.2.1
      - name: Generate voice-over
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
          SCENE_IDS: ${{ github.event.inputs.scene_ids }}
        run: python collectors/prepare_job.py "$PROJECT_ID" "$SCENE_IDS"
