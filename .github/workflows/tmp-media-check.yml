name: TMP move videos to the VDS
on:
  push:
    branches: [tmp/media-check]
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Move
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEDIA_URL: ${{ secrets.MEDIA_URL }}
          MEDIA_SECRET: ${{ secrets.MEDIA_SECRET }}
          MODE: copy
        run: node render/tmp-migrate.mjs
