name: Long to Shorts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "analyze (a long video), render (one Short) or voice (a Short's narrator lines)"
        required: true
      id:
        description: "clip_sources.id for analyze, clips.id for render"
        required: true
concurrency: { group: "clipper-${{ github.event.inputs.id }}", cancel-in-progress: false }
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/clipper.yml
      - name: Keep the speech model between runs
        if: github.event.inputs.mode == 'analyze'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Install (voice only)
        if: github.event.inputs.mode == 'voice'
        timeout-minutes: 3
        run: pip install -q requests==2.32.3 edge-tts==7.3.1
      - name: Install
        if: github.event.inputs.mode != 'voice'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q requests==2.32.3 faster-whisper==1.2.1 opencv-python-headless==4.10.0.84 numpy==1.26.4 gdown==5.2.0 fonttools==4.54.1 brotli==1.1.0 edge-tts==7.3.1
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEDIA_URL: ${{ secrets.MEDIA_URL }}
          MEDIA_SECRET: ${{ secrets.MEDIA_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ github.event.inputs.mode }}
          ID: ${{ github.event.inputs.id }}
        run: python collectors/clipper.py "$MODE" "$ID"
      - name: Say so if the machine stopped it
        if: cancelled()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          ID: ${{ github.event.inputs.id }}
        run: |
          table=$([ "$MODE" = "analyze" ] && echo clip_sources || echo clips)
          msg="The job was stopped (it took too long or was cancelled). Try again."
          body=$([ "$MODE" = "voice" ] && echo "{\"voice_state\":\"failed\",\"voice_error\":\"$msg\"}" || echo "{\"status\":\"failed\",\"error\":\"$msg\"}")
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/$table?id=eq.$ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d "$body"
